<svg width="100%" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Card and Element Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.2)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.1)" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(192, 132, 252, 0.2)" />
      <stop offset="100%" stop-color="rgba(236, 72, 153, 0.1)" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style><![CDATA[
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    
    /* Animated Glowing Nodes and Circles */
    @keyframes pulseOrb {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.35; }
      50% { transform: translateY(-12px) scale(1.1); opacity: 0.65; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -40; }
    }

    .orb-1 { animation: pulseOrb 6s ease-in-out infinite; transform-origin: 850px 70px; }
    .orb-2 { animation: pulseOrb 8s ease-in-out infinite 2s; transform-origin: 150px 180px; }
    .float-item-1 { animation: floatPill 5s ease-in-out infinite; }
    .float-item-2 { animation: floatPill 6s ease-in-out infinite 1s; }
    .float-item-3 { animation: floatPill 5.5s ease-in-out infinite 2.5s; }
    .stream-line { stroke-dasharray: 6 6; animation: dashStream 3s linear infinite; }
    
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
  ]]></style>

  <!-- Background Base -->
  <rect width="1000" height="240" rx="16" class="bg" />

  <!-- Background Grid -->
  <line x1="0" y1="60" x2="1000" y2="60" class="grid-line" />
  <line x1="0" y1="120" x2="1000" y2="120" class="grid-line" />
  <line x1="0" y1="180" x2="1000" y2="180" class="grid-line" />
  <line x1="200" y1="0" x2="200" y2="240" class="grid-line" />
  <line x1="400" y1="0" x2="400" y2="240" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="240" class="grid-line" />
  <line x1="800" y1="0" x2="800" y2="240" class="grid-line" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="860" cy="70" r="110" fill="#6366f1" filter="url(#glow)" class="orb-1" />
  <circle cx="120" cy="180" r="90" fill="#0284c7" filter="url(#glow)" class="orb-2" />

  <!-- Background Streaming Data Flow Lines -->
  <path d="M 100 200 C 300 220, 450 180, 600 200 C 750 220, 900 170, 980 180" stroke="rgba(99, 102, 241, 0.25)" stroke-width="2" fill="none" class="stream-line" />
  <path d="M 50 60 C 250 40, 500 70, 700 40 C 850 20, 920 60, 980 50" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" fill="none" class="stream-line" />

  <!-- Floating Dynamic Language / Architecture Pills in Background Layer -->
  <g class="float-item-1">
    <rect x="750" y="45" width="135" height="28" rx="14" fill="url(#pillGrad1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="764" cy="59" r="4" fill="#38bdf8" />
    <text x="776" y="63" fill="#bae6fd" class="badge-label">🌐 i18n &amp; l10n CMS</text>
  </g>

  <g class="float-item-2">
    <rect x="785" y="145" width="145" height="28" rx="14" fill="url(#pillGrad2)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
    <circle cx="799" cy="159" r="4" fill="#c084fc" />
    <text x="811" y="163" fill="#f5d0fe" class="badge-label">⚡ Automated TMS</text>
  </g>

  <g class="float-item-3">
    <rect x="630" y="180" width="130" height="28" rx="14" fill="url(#pillGrad1)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
    <circle cx="644" cy="194" r="4" fill="#818cf8" />
    <text x="656" y="198" fill="#c7d2fe" class="badge-label">🚀 Global Scale</text>
  </g>

  <!-- High-Contrast Decorative Globe / Network Silhouette on Right -->
  <g transform="translate(840, 115)" opacity="0.3">
    <circle cx="0" cy="0" r="45" stroke="#818cf8" stroke-width="1.5" fill="none" />
    <ellipse cx="0" cy="0" rx="45" ry="18" stroke="#818cf8" stroke-width="1.2" fill="none" />
    <ellipse cx="0" cy="0" rx="18" ry="45" stroke="#818cf8" stroke-width="1.2" fill="none" />
    <line x1="-45" y1="0" x2="45" y2="0" stroke="#818cf8" stroke-width="1" />
  </g>

  <!-- Foreground Title and Content (Unobstructed and High Contrast) -->
  <g transform="translate(60, 45)">
    <!-- Small Category Badge -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
    <circle cx="12" cy="13" r="4" fill="#38bdf8" />
    <text x="24" y="17" fill="#38bdf8" class="badge-label">CURATED DIRECTORY &amp; GUIDE</text>

    <!-- Main Title -->
    <text x="0" y="65" fill="#f8fafc" class="title-text">
      Awesome Multilingual Website
    </text>
    <text x="0" y="105" fill="url(#accentGrad)" class="title-text">
      &amp; Content Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="138" class="subtitle-text">
      Enterprise SaaS TMS, Headless CMS Localization &amp; Open-Source Translation Stacks
    </text>
  </g>
</svg>
